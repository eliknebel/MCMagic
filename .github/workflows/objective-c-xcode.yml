name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, analyze, and test MCMagic
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and analyze
        run: |
          xcodebuild clean build analyze \
            -project MCMagic.xcodeproj \
            -target MCMagic \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO
      - name: Run tests
        run: zsh Tests/run_tests.sh
