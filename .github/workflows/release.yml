name: Xcode - Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and package MCMagic
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare release directory
        run: |
          mkdir -p "$RUNNER_TEMP/mcmagic-release"
          echo "RELEASE_DIR=$RUNNER_TEMP/mcmagic-release" >> "$GITHUB_ENV"

      - name: Run tests
        run: zsh Tests/run_tests.sh

      - name: Build universal Release app
        run: |
          xcodebuild -version
          xcodebuild clean build \
            -project MCMagic.xcodeproj \
            -target MCMagic \
            -configuration Release \
            -sdk macosx \
            "ARCHS=arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SYMROOT="$RELEASE_DIR/products" \
            OBJROOT="$RELEASE_DIR/intermediates"
          app="$RELEASE_DIR/products/Release/MCMagic.app"
          architectures=$(lipo -archs "$app/Contents/MacOS/MCMagic")
          if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
            echo "::error::The release app must contain both arm64 and x86_64."
            exit 1
          fi
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the app version v$version. Update MARKETING_VERSION before tagging."
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Ad hoc sign app
        run: |
          app="$RELEASE_DIR/products/Release/MCMagic.app"
          codesign --force --sign - --options runtime --timestamp=none "$app"
          codesign --verify --deep --strict --all-architectures --verbose=2 "$app"

      - name: Create DMG
        run: |
          staging="$RELEASE_DIR/dmg-root"
          mkdir -p "$staging" "$RELEASE_DIR/dist"
          ditto "$RELEASE_DIR/products/Release/MCMagic.app" "$staging/MCMagic.app"
          ln -s /Applications "$staging/Applications"
          cd "$RELEASE_DIR/dist"
          image="MCMagic-$RELEASE_VERSION-$GITHUB_RUN_NUMBER-macOS-universal-adhoc.dmg"
          hdiutil create -volname MCMagic -srcfolder "$staging" \
            -format UDZO -fs HFS+ "$image"
          hdiutil verify "$image"
          echo "RELEASE_DMG=$RELEASE_DIR/dist/$image" >> "$GITHUB_ENV"
          echo 'DMG SHA-256:' >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 "$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.RELEASE_DMG }}
          archive: false
          if-no-files-found: error
          retention-days: 30
